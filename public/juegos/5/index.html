<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX GP — Fórmula 1 Arcade Racing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; overflow: hidden; font-family: 'Segoe UI', 'Arial', sans-serif; color: #fff; user-select: none; }
        canvas { position: absolute; top: 0; left: 0; display: block; }

        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .screen.active { display: flex; }

        /* START SCREEN */
        #startScreen { background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0a0f 70%); }
        #startScreen .logo { font-size: 5rem; font-weight: 900; letter-spacing: 0.15em; background: linear-gradient(135deg, #00d4ff, #ff006e, #ffd700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: none; animation: logoPulse 3s ease-in-out infinite; }
        @keyframes logoPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
        #startScreen .sub { font-size: 1.1rem; color: #888; letter-spacing: 0.4em; margin-bottom: 50px; text-transform: uppercase; }
        .menu-btn { display: block; width: 300px; padding: 14px; margin: 8px 0; background: transparent; border: 2px solid #333; color: #aaa; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; border-radius: 4px; }
        .menu-btn:hover { border-color: #00d4ff; color: #00d4ff; box-shadow: 0 0 20px rgba(0,212,255,0.2); }
        .menu-btn.primary { border-color: #ff006e; color: #ff006e; }
        .menu-btn.primary:hover { background: #ff006e; color: #fff; box-shadow: 0 0 30px rgba(255,0,110,0.4); }

        /* GARAGE SCREEN */
        #garageScreen { background: radial-gradient(ellipse at center, #0f1a2e 0%, #0a0a0f 70%); }
        .garage-title { font-size: 2.2rem; font-weight: 900; color: #00d4ff; margin-bottom: 20px; letter-spacing: 0.1em; }
        .team-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 700px; margin-bottom: 30px; }
        .team-card { background: rgba(255,255,255,0.03); border: 2px solid #222; border-radius: 6px; padding: 10px; cursor: pointer; text-align: center; transition: all 0.2s; }
        .team-card:hover { border-color: #555; }
        .team-card.selected { border-color: #00d4ff; box-shadow: 0 0 15px rgba(0,212,255,0.3); }
        .team-card .car-preview { width: 40px; height: 18px; margin: 0 auto 6px; border-radius: 3px; }
        .team-card .team-name { font-size: 0.7rem; font-weight: 700; color: #ccc; }
        .stats-panel { display: flex; gap: 30px; margin-bottom: 30px; }
        .stat-bar { text-align: center; }
        .stat-bar label { font-size: 0.7rem; color: #888; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .stat-bar .bar-bg { width: 80px; height: 8px; background: #222; border-radius: 4px; overflow: hidden; }
        .stat-bar .bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
        .difficulty-row { display: flex; gap: 10px; margin-bottom: 30px; }
        .diff-btn { padding: 8px 20px; border: 1px solid #333; background: transparent; color: #888; cursor: pointer; border-radius: 4px; font-size: 0.85rem; transition: all 0.2s; }
        .diff-btn.selected { border-color: #ffd700; color: #ffd700; background: rgba(255,215,0,0.1); }

        /* CIRCUIT SCREEN */
        #circuitScreen { background: radial-gradient(ellipse at center, #0a1a0f 0%, #0a0a0f 70%); }
        .circuit-title { font-size: 2.2rem; font-weight: 900; color: #00ff88; margin-bottom: 20px; }
        .circuit-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 800px; margin-bottom: 30px; }
        .circuit-card { background: rgba(255,255,255,0.03); border: 2px solid #222; border-radius: 8px; padding: 14px; cursor: pointer; text-align: center; transition: all 0.2s; }
        .circuit-card:hover { border-color: #444; }
        .circuit-card.selected { border-color: #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.3); }
        .circuit-card.locked { opacity: 0.3; pointer-events: none; }
        .circuit-card .circuit-icon { font-size: 2rem; margin-bottom: 6px; }
        .circuit-card .circuit-name { font-size: 0.8rem; font-weight: 700; color: #ccc; }
        .circuit-card .circuit-diff { font-size: 0.7rem; color: #888; margin-top: 4px; }

        /* RACE HUD */
        #raceHud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
        .hud-top-left { position: absolute; top: 15px; left: 15px; }
        .hud-position { font-size: 2.5rem; font-weight: 900; color: #ffd700; line-height: 1; }
        .hud-position span { font-size: 1rem; color: #888; }
        .hud-lap { font-size: 0.85rem; color: #aaa; margin-top: 4px; }
        .hud-time { font-size: 0.8rem; color: #666; margin-top: 2px; }
        .hud-top-right { position: absolute; top: 15px; right: 15px; width: 160px; height: 160px; background: rgba(0,0,0,0.7); border: 1px solid #333; border-radius: 6px; overflow: hidden; }
        .hud-top-right canvas { width: 100%; height: 100%; }
        .hud-bottom-left { position: absolute; bottom: 15px; left: 15px; background: rgba(0,0,0,0.75); border: 1px solid #333; border-radius: 6px; padding: 12px 16px; }
        .hud-speed { font-size: 2.2rem; font-weight: 900; color: #00d4ff; line-height: 1; }
        .hud-speed small { font-size: 0.8rem; color: #666; }
        .hud-ers { margin-top: 8px; }
        .hud-ers-label { font-size: 0.65rem; color: #888; text-transform: uppercase; margin-bottom: 2px; }
        .hud-ers-bar { width: 120px; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }

        .hud-tires { margin-top: 8px; }
        .hud-tires-label { font-size: 0.65rem; color: #888; text-transform: uppercase; margin-bottom: 2px; }
        .hud-tires-bar { width: 120px; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
        .hud-tires-fill { height: 100%; border-radius: 3px; transition: width 0.3s, background 0.3s; }
        .hud-bottom-right { position: absolute; bottom: 15px; right: 15px; background: rgba(0,0,0,0.75); border: 1px solid #333; border-radius: 6px; padding: 10px 14px; }
        .hud-laptimes { font-size: 0.7rem; color: #888; }
        .hud-laptimes div { margin: 2px 0; }
        .hud-laptimes .best { color: #ffd700; }
        .hud-laptimes .current { color: #00d4ff; }
        .hud-center-msg { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; font-weight: 900; color: #fff; text-shadow: 0 0 30px rgba(255,255,255,0.5); opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .hud-center-msg.visible { opacity: 1; }
        .hud-tire-type { position: absolute; bottom: 60px; left: 15px; font-size: 0.7rem; padding: 3px 10px; border-radius: 3px; font-weight: 700; }
        .hud-drift-indicator { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); font-size: 1.2rem; font-weight: 900; color: #ff4500; text-shadow: 0 0 20px #ff4500; opacity: 0; transition: opacity 0.2s; }
        .hud-drift-indicator.visible { opacity: 1; }
        .hud-ers-ready { position: absolute; top: 50%; right: 30px; transform: translateY(-50%); font-size: 0.8rem; font-weight: 700; color: #ffd700; opacity: 0; transition: opacity 0.3s; }
        .hud-ers-ready.visible { opacity: 1; }
        .hud-slipscreen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 0.9rem; font-weight: 700; color: #00ff88; text-shadow: 0 0 15px #00ff88; opacity: 0; transition: opacity 0.3s; }
        .hud-slipscreen.visible { opacity: 1; }
        .hud-leaderboard { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border: 1px solid #333; border-radius: 6px; padding: 8px 14px; font-size: 0.7rem; min-width: 220px; }
        .hud-leaderboard .lb-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }

        .hud-leaderboard .lb-pos.p2 { color: #c0c0c0; }

        .settings-row input[type="range"] { flex: 2; }
        .settings-row .val { width: 40px; text-align: right; color: #ffd700; font-weight: 700; }

</head>

<script>
// ============================================================
//  APEX GP — FÓRMULA 1 ARCADE RACING
//  Vanilla JS + Canvas 2D — Single File Game
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const miniCanvas = document.getElementById('minimapCanvas');
const miniCtx = miniCanvas.getContext('2d');

// Tire marks offscreen canvas
const tireMarksCanvas = document.createElement('canvas');
const tireMarksCtx = tireMarksCanvas.getContext('2d');
tireMarksCanvas.width = 2600;
tireMarksCanvas.height = 1600;

// ============================================================
//  CONSTANTS
// ============================================================
const PI = Math.PI;
const TWO_PI = PI * 2;
const DEG = PI / 180;
const MAX_SPEED = 14; // px/frame
const ACCEL = 0.18;
const BRAKE = 0.25;
const FRICTION = 0.02;
const TURN_RATE = 0.045;
const DRIFT_TURN_MULT = 1.6;
const DRIFT_FRICTION = 0.008;
const ERS_BOOST = 1.8; // multiplier
const ERS_MAX = 100;
const ERS_COST = 25;
const ERS_REGEN = 0.15;
const TIRE_WEAR_RATE = 0.0008;
const SLIPSTREAM_DIST = 80;
const SLIPSTREAM_TIME = 90; // frames
const SLIPSTREAM_MULT = 1.2;

// ============================================================
//  GAME STATE
// ============================================================
let gameState = 'menu'; // menu, garage, circuit, countdown, racing, paused, podium
let gameMode = 'championship'; // championship, timeTrial, arcade, boss
let selectedTeam = 0;
let selectedCircuit = 0;
let difficulty = 'medium';
let camera = { x: 0, y: 0 };
let shake = { x: 0, y: 0, intensity: 0 };
let frameCount = 0;
let raceTime = 0;
let countdownTimer = 0;
let countdownNum = 0;
let lastTime = 0;

// ============================================================
//  MONEY & CAREER
// ============================================================
const PRIZE_MONEY = {
    1: 100, 2: 91, 3: 64, 4: 53, 5: 34, 6: 23, boss: 300
};
let playerMoney = parseInt(localStorage.getItem('apexgp_money') || '0');
let playerWins = parseInt(localStorage.getItem('apexgp_wins') || '0');
let bossUnlocked = playerWins >= 5;
let lastPrizeWon = 0;

function saveCareer() {
    localStorage.setItem('apexgp_money', String(playerMoney));
    localStorage.setItem('apexgp_wins', String(playerWins));
    bossUnlocked = playerWins >= 5;
}

function awardPrize(position) {
    const prize = gameMode === 'boss' ? PRIZE_MONEY.boss : (PRIZE_MONEY[position] || 0);
    if (prize > 0) {
        playerMoney += prize;
        lastPrizeWon = prize;
        if (position === 1 && gameMode !== 'boss') playerWins++;
        saveCareer();
    }
    return prize;
}
let dt = 0;

// ============================================================
//  SETTINGS
// ============================================================
let settings = { volEngine: 50, volMusic: 30, volSfx: 70, shakeAmount: 80 };

// ============================================================
//  MONEY & BOSS SYSTEM
// ============================================================
const PRIZE_MONEY = { 1: 100, 2: 91, 3: 64, 4: 53, 5: 34, 6: 23 };
const BOSS_ENTRY_COST = 300;
const BOSS_PRIZE = 300;

const TEAMS = [

// ============================================================
//  CIRCUITS — Waypoints define center line
// ============================================================
function generateEllipse(cx, cy, rx, ry, points, wobble) {
    const wp = [];
    for (let i = 0; i < points; i++) {
        const a = (i / points) * TWO_PI;
        const wx = wobble ? Math.sin(a * 3) * wobble : 0;
        const wy = wobble ? Math.cos(a * 2) * wobble * 0.5 : 0;
        wp.push({ x: cx + Math.cos(a) * (rx + wx), y: cy + Math.sin(a) * (ry + wy) });
    }
    return wp;
}

function generateMonaco() {
    const wp = [];
    const s = 3;

let audioCtx = null;
let masterGain = null;
let engineOsc = null;
let engineGain = null;
let musicPlaying = false;

function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.5;
    masterGain.connect(audioCtx.destination);

    // Engine oscillator
    engineOsc = audioCtx.createOscillator();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 80;
    engineGain = audioCtx.createGain();
    engineGain.gain.value = 0;
    const engineFilter = audioCtx.createBiquadFilter();
    engineFilter.type = 'lowpass';
    engineFilter.frequency.value = 800;
    engineOsc.connect(engineFilter);
    engineFilter.connect(engineGain);
    engineGain.connect(masterGain);
    engineOsc.start();
}

function updateEngineSound(speed, maxSpeed) {
    if (!engineOsc) return;
    const ratio = Math.abs(speed) / maxSpeed;
    const freq = 80 + ratio * 720;
    engineOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.05);
    engineGain.gain.setTargetAtTime(0.08 * (settings.volEngine / 100), audioCtx.currentTime, 0.05);
}

function playSfx(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(masterGain);
    const vol = settings.volSfx / 100;
    switch (type) {
        case 'drift':
            osc.type = 'sawtooth';
            osc.frequency.value = 2000;
            gain.gain.setValueAtTime(0.06 * vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            break;
        case 'ers':
            osc.type = 'square';
            osc.frequency.value = 200;
            osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1 * vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
            osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            break;
        case 'countdown':
            osc.type = 'sine';
            osc.frequency.value = 440;
            gain.gain.setValueAtTime(0.15 * vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            break;
        case 'go':
            osc.type = 'sine';
            osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.2 * vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            break;
        case 'crash':
            osc.type = 'sawtooth';
            osc.frequency.value = 100;
            gain.gain.setValueAtTime(0.12 * vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            break;
        case 'lap':
            osc.type = 'sine';
            osc.frequency.value = 660;
            gain.gain.setValueAtTime(0.15 * vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            break;
    }
}

function readGamepad() {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    gamepadState = gps[0] || null;
    if (!gamepadState) return;
    // Map gamepad to virtual keys
    if (gamepadState.buttons[7]?.pressed) keys['w'] = true;
    else if (!keys['_w']) keys['w'] = false;
    if (gamepadState.buttons[6]?.pressed) keys['s'] = true;
    else if (!keys['_s']) keys['s'] = false;
    const lx = gamepadState.axes[0] || 0;
    if (lx < -0.2) keys['a'] = true; else if (!keys['_a']) keys['a'] = false;
    if (lx > 0.2) keys['d'] = true; else if (!keys['_d']) keys['d'] = false;
    if (gamepadState.buttons[0]?.pressed) keys['shift'] = true;
    else if (!keys['_shift']) keys['shift'] = false;
    if (gamepadState.buttons[1]?.pressed) keys[' '] = true;
    else if (!keys['_ ']) keys[' '] = false;
}

// ============================================================
//  AI RIVALS
// ============================================================
function aiUpdate(car, track, allCars) {
    const wp = track.waypoints;
    const lookAhead = 3;
    const target = wp[(car.waypointIdx + lookAhead) % wp.length];
    const targetAngle = Math.atan2(target.y - car.y, target.x - car.x);
    let angleDiff = targetAngle - car.angle;
    while (angleDiff > PI) angleDiff -= TWO_PI;
    while (angleDiff < -PI) angleDiff += TWO_PI;

    let error = 0;
    if (car.aiProfile === 'unpredictable') error = (Math.random() - 0.5) * 0.08;
    else if (car.aiProfile === 'aggressive') error = angleDiff * 0.01;

    car.aiTargetAngle = targetAngle + error;
    car.aiSteerSmooth += (angleDiff - car.aiSteerSmooth) * 0.08;

    const steer = car.aiSteerSmooth * 2.2;
    car.angle += steer * car.turnRate;

    let targetSpeed = car.maxSpeed * 0.88;
    const absDiff = Math.abs(angleDiff);
    if (absDiff > 0.6) targetSpeed *= 0.45;
    else if (absDiff > 0.4) targetSpeed *= 0.65;
    else if (absDiff > 0.2) targetSpeed *= 0.85;

    if (car.aiProfile === 'speedster') targetSpeed *= 1.08;
    if (car.aiProfile === 'aggressive') targetSpeed *= 1.03;

    const diffMod = { easy: 0.72, medium: 0.85, hard: 0.94, expert: 1.0 }[difficulty] || 0.85;
    targetSpeed *= diffMod;

    for (const other of allCars) {
        if (other === car || !other) continue;
        const dist = Math.hypot(other.x - car.x, other.y - car.y);
        const angleToOther = Math.atan2(other.y - car.y, other.x - car.x);
        let aDiff = angleToOther - car.angle;
        while (aDiff > PI) aDiff -= TWO_PI;
        while (aDiff < -PI) aDiff += TWO_PI;
        if (dist < SLIPSTREAM_DIST && Math.abs(aDiff) < 0.3) {
            car.slipstreamTimer++;
            if (car.slipstreamTimer > SLIPSTREAM_TIME) {
                car.slipstreamActive = true;
                targetSpeed *= SLIPSTREAM_MULT;
            }
        }
    }
    if (car.slipstreamTimer > 0 && car.slipstreamTimer <= SLIPSTREAM_TIME) car.slipstreamTimer--;
    if (car.slipstreamActive && car.slipstreamTimer < -30) car.slipstreamActive = false;

    for (const other of allCars) {
        if (other === car || !other) continue;
        const dist = Math.hypot(other.x - car.x, other.y - car.y);
        if (dist < 60 && dist > 0.1) {
            const pushAngle = Math.atan2(car.y - other.y, car.x - other.x);
            const strength = Math.max(0, 1 - dist / 60) * 0.12;
            car.angle += pushAngle * strength;
            if (dist < 40) targetSpeed *= 0.85;
        }
    }

    if (car.speed < targetSpeed) car.speed += car.accel * 0.9;
    else car.speed -= car.brakeForce * 0.6;
    car.speed = Math.max(0, Math.min(car.speed, car.maxSpeed));
}

// ============================================================
//  PHYSICS
// ============================================================
function carPhysics(car) {
    const prevX = car.x;
    const prevY = car.y;

    // Tire wear
    if (car.tires > 0) {
        car.tires -= TIRE_WEAR_RATE * (car.drifting ? 3 : 1) * (Math.abs(car.speed) / car.maxSpeed);
        car.tires = Math.max(0, car.tires);
    }

    const tireMult = car.tires > 20 ? 1 : 0.6 + (car.tires / 20) * 0.4;
    const effectiveMax = car.maxSpeed * tireMult;

    // ERS
    if (car.ersActive && car.ers >= ERS_COST) {
        car.speed = Math.min(car.speed * ERS_BOOST, effectiveMax * ERS_BOOST);
        car.ers -= ERS_COST;
        car.ersActive = false;
    }
    car.ers = Math.min(ERS_MAX, car.ers + ERS_REGEN * (Math.abs(car.speed) / car.maxSpeed));

    // Turbo powerup
    if (car.turboActive) {
        car.turboTimer--;
        car.speed = effectiveMax * 1.3;
        if (car.turboTimer <= 0) car.turboActive = false;
    }

    // Shield
    if (car.shieldActive) {
        car.shieldTimer--;
        if (car.shieldTimer <= 0) car.shieldActive = false;
    }

    // Movement
    car.x += Math.cos(car.angle) * car.speed;
    car.y += Math.sin(car.angle) * car.speed;

    // HARD WALL — car cannot leave track
    const onTrack = isOnTrack(car.x, car.y, currentTrack);
    if (!onTrack) {
        car.x = prevX;
        car.y = prevY;
        car.speed *= 0.4;
        // Push back toward track center
        const wp = currentTrack.waypoints;
        let closest = wp[0], closestDist = Infinity;
        for (const p of wp) {
            const d = Math.hypot(car.x - p.x, car.y - p.y);
            if (d < closestDist) { closest = p; closestDist = d; }
        }
        const pushAngle = Math.atan2(closest.y - car.y, closest.x - car.x);
        car.x += Math.cos(pushAngle) * 3;
        car.y += Math.sin(pushAngle) * 3;
        car.angle += (pushAngle - car.angle) * 0.1;
        if (car.isPlayer && frameCount % 30 === 0) {
            showCenterMessage('¡FUERA DE PISTA!');
        }
    }

    // Obstacle collision
    if (obstacles && obstacles.length > 0) {
        for (const obs of obstacles) {
            if (!obs.active) continue;
            const dist = Math.hypot(car.x - obs.x, car.y - obs.y);
            if (dist < obs.radius + 10) {
                // Bounce back
                const bounceAngle = Math.atan2(car.y - obs.y, car.x - obs.x);
                car.x = obs.x + Math.cos(bounceAngle) * (obs.radius + 12);
                car.y = obs.y + Math.sin(bounceAngle) * (obs.radius + 12);
                car.speed *= 0.3;
                car.angle = bounceAngle;
                car.collisionCooldown = 20;
                shake.intensity = 4;
                spawnParticles(car.x, car.y, 8, '#ff8800', 3, 15);
                playSfx('crash');
                // Respawn behind obstacle after delay
                car.respawnTimer = 40;
                car.respawnX = obs.x + Math.cos(bounceAngle) * (obs.radius + 25);
                car.respawnY = obs.y + Math.sin(bounceAngle) * (obs.radius + 25);
                break;
            }
        }
    }

    // Respawn from obstacle
    if (car.respawnTimer > 0) {
        car.respawnTimer--;
        car.speed = 0;
        if (car.respawnTimer === 0 && car.respawnX) {
            car.x = car.respawnX;
            car.y = car.respawnY;
            const wp = currentTrack.waypoints;
            const next = wp[(car.waypointIdx + 1) % wp.length];
            car.angle = Math.atan2(next.y - car.y, next.x - car.x);
            car.respawnX = null;
            car.respawnY = null;
        }
    }

    // Boundary hard lock
    if (car.x < 20) { car.x = 20; car.speed *= 0.3; }
    if (car.x > worldWidth - 20) { car.x = worldWidth - 20; car.speed *= 0.3; }
    if (car.y < 20) { car.y = 20; car.speed *= 0.3; }
    if (car.y > worldHeight - 20) { car.y = worldHeight - 20; car.speed *= 0.3; }
}

// ============================================================
//  TRACK RENDERING
// ============================================================
let worldWidth = 2600;
let worldHeight = 1600;
let currentTrack = null;
let trackPath = null;

function buildTrackPath(track) {
    const wp = track.waypoints;
    trackPath = new Path2D();
    trackPath.moveTo(wp[0].x, wp[0].y);
    for (let i = 1; i <= wp.length; i++) {
        const p = wp[i % wp.length];
        const prev = wp[(i - 1) % wp.length];
        const next = wp[(i + 1) % wp.length];
        const next2 = wp[(i + 2) % wp.length];
        // Catmull-Rom to Bezier
        const cp1x = prev.x + (p.x - wp[(i - 2 + wp.length) % wp.length].x) / 6;
        const cp1y = prev.y + (p.y - wp[(i - 2 + wp.length) % wp.length].y) / 6;
        const cp2x = p.x - (next.x - prev.x) / 6;
        const cp2y = p.y - (next.y - prev.y) / 6;
        trackPath.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p.x, p.y);
    }
    trackPath.closePath();
}

function drawTrack(track) {
    const isNight = track.night;
    ctx.fillStyle = isNight ? '#050510' : '#0a1a0a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-camera.x + shake.x, -camera.y + shake.y);

    // Grass/terrain
    ctx.fillStyle = isNight ? '#0a0a1a' : '#0d2818';
    ctx.fillRect(camera.x - 100, camera.y - 100, canvas.width + 200, canvas.height + 200);

    if (trackPath) {
        // Outer curb (red-white stripes)
        ctx.lineWidth = track.width + 8;
        ctx.strokeStyle = '#cc2222';
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke(trackPath);

        // White curb edge
        ctx.lineWidth = track.width + 4;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke(trackPath);

        // Track surface
        ctx.lineWidth = track.width;
        ctx.strokeStyle = '#1e1e30';
        ctx.stroke(trackPath);

        // Subtle asphalt texture (inner lighter line)
        ctx.lineWidth = track.width * 0.4;
        ctx.strokeStyle = isNight ? '#22223a' : '#252538';
        ctx.stroke(trackPath);

        // Center line dashed
        ctx.lineWidth = 1;
        ctx.strokeStyle = '#ffffff18';
        ctx.setLineDash([18, 18]);
        ctx.stroke(trackPath);
        ctx.setLineDash([]);

        // Start/finish line
        const sf = track.waypoints[0];
        const sfNext = track.waypoints[1];
        const sfAngle = Math.atan2(sfNext.y - sf.y, sfNext.x - sf.x) + PI / 2;
        ctx.save();
        ctx.translate(sf.x, sf.y);
        ctx.rotate(sfAngle);
        for (let i = -track.width / 2; i < track.width / 2; i += 12) {
            ctx.fillStyle = ((i / 12) % 2 === 0) ? '#fff' : '#111';
            ctx.fillRect(i, -4, 6, 8);
        }
        ctx.restore();
    }

    // Night neon glow
    if (isNight && trackPath) {
        ctx.lineWidth = track.width + 2;
        ctx.strokeStyle = '#00d4ff12';
        ctx.shadowColor = '#00d4ff';
        ctx.shadowBlur = 25;
        ctx.stroke(trackPath);
        ctx.shadowBlur = 0;
    }

    // Track decorations — trees, barriers, grandstands
    drawTrackDecorations(track);

    ctx.restore();
}

let trackDecorations = null;
function generateDecorations(track) {
    const decos = [];
    const wp = track.waypoints;
    const w = track.width / 2 + 25;
    for (let i = 0; i < wp.length; i += 2) {
        const p = wp[i];
        const next = wp[(i + 1) % wp.length];
        const angle = Math.atan2(next.y - p.y, next.x - p.x);
        const perp = angle + PI / 2;
        const side = (i % 4 < 2) ? 1 : -1;
        const dist = w + 15 + Math.random() * 30;
        const dx = p.x + Math.cos(perp) * dist * side;
        const dy = p.y + Math.sin(perp) * dist * side;
        const type = Math.random();
        if (type < 0.4) decos.push({ x: dx, y: dy, type: 'tree', size: 6 + Math.random() * 4 });
        else if (type < 0.7) decos.push({ x: dx, y: dy, type: 'barrier', size: 8 });
        else if (type < 0.85) decos.push({ x: dx, y: dy, type: 'grandstand', size: 20 });
        else decos.push({ x: dx, y: dy, type: 'light', size: 4 });
    }
    trackDecorations = decos;
}

function drawTrackDecorations(track) {
    if (!trackDecorations) return;
    const isNight = track.night;
    for (const d of trackDecorations) {
        const sx = d.x - camera.x + shake.x;
        const sy = d.y - camera.y + shake.y;
        if (sx < -50 || sx > canvas.width + 50 || sy < -50 || sy > canvas.height + 50) continue;
        switch (d.type) {
            case 'tree':
                ctx.fillStyle = isNight ? '#0a2a1a' : '#1a5c2a';
                ctx.beginPath();
                ctx.arc(sx, sy, d.size, 0, TWO_PI);
                ctx.fill();
                ctx.fillStyle = isNight ? '#061a0e' : '#0e3a18';
                ctx.beginPath();
                ctx.arc(sx - 1, sy - 1, d.size * 0.7, 0, TWO_PI);
                ctx.fill();
                break;
            case 'barrier':
                ctx.fillStyle = isNight ? '#333' : '#888';
                ctx.fillRect(sx - 6, sy - 3, 12, 6);
                ctx.fillStyle = isNight ? '#555' : '#aaa';
                ctx.fillRect(sx - 5, sy - 2, 10, 2);
                break;
            case 'grandstand':
                ctx.fillStyle = isNight ? '#1a1a2e' : '#444';
                ctx.fillRect(sx - d.size / 2, sy - d.size / 3, d.size, d.size * 0.6);
                ctx.fillStyle = isNight ? '#2a2a4e' : '#666';
                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 4; c++) {
                        ctx.fillRect(sx - d.size / 2 + 3 + c * 5, sy - d.size / 3 + 2 + r * 4, 3, 2);
                    }
                }
                break;
            case 'light':
                ctx.fillStyle = isNight ? '#ffd70066' : '#ff0';
                ctx.beginPath();
                ctx.arc(sx, sy, d.size, 0, TWO_PI);
                ctx.fill();
                if (isNight) {
                    ctx.fillStyle = 'rgba(255,215,0,0.05)';
                    ctx.beginPath();
                    ctx.arc(sx, sy, 40, 0, TWO_PI);
                    ctx.fill();
                }
                break;
        }
    }
}

function drawMinimap(track) {
    miniCtx.fillStyle = 'rgba(0,0,0,0.8)';
    miniCtx.fillRect(0, 0, 160, 160);
    if (!track) return;
    const wp = track.waypoints;
    const minX = Math.min(...wp.map(p => p.x));
    const maxX = Math.max(...wp.map(p => p.x));
    const minY = Math.min(...wp.map(p => p.y));
    const maxY = Math.max(...wp.map(p => p.y));
    const scaleX = 140 / (maxX - minX);
    const scaleY = 140 / (maxY - minY);
    const scale = Math.min(scaleX, scaleY) * 0.85;
    const ox = 10 + (140 - (maxX - minX) * scale) / 2;
    const oy = 10 + (140 - (maxY - minY) * scale) / 2;

    miniCtx.strokeStyle = '#333';
    miniCtx.lineWidth = 3;
    miniCtx.beginPath();
    for (let i = 0; i <= wp.length; i++) {
        const p = wp[i % wp.length];
        const sx = (p.x - minX) * scale + ox;
        const sy = (p.y - minY) * scale + oy;
        if (i === 0) miniCtx.moveTo(sx, sy);
        else miniCtx.lineTo(sx, sy);
    }
    miniCtx.stroke();

    // Draw cars on minimap
    allCars.forEach(car => {
        const sx = (car.x - minX) * scale + ox;
        const sy = (car.y - minY) * scale + oy;
        miniCtx.fillStyle = car.isPlayer ? '#00d4ff' : car.team.color;
        miniCtx.beginPath();
        miniCtx.arc(sx, sy, car.isPlayer ? 4 : 3, 0, TWO_PI);
        miniCtx.fill();
    });
}

// ============================================================
//  CAR RENDERING
// ============================================================
function drawCar(car) {
    ctx.save();
    ctx.translate(car.x - camera.x + shake.x, car.y - camera.y + shake.y);
    ctx.rotate(car.angle);

    const w = 26, h = 11;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(2, 3, w * 0.45, h * 0.4, 0, 0, TWO_PI);
    ctx.fill();

    // Shield glow
    if (car.shieldActive) {
        ctx.strokeStyle = '#00ff8888';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 20, 0, TWO_PI);
        ctx.stroke();
    }

    // Turbo flame
    if (car.turboActive) {
        const flameLen = 12 + Math.random() * 10;
        ctx.fillStyle = '#ff660088';
        ctx.beginPath();
        ctx.moveTo(-w / 2 - 4, -3);
        ctx.lineTo(-w / 2 - flameLen, 0);
        ctx.lineTo(-w / 2 - 4, 3);
        ctx.fill();
        ctx.fillStyle = '#ffd70066';
        ctx.beginPath();
        ctx.moveTo(-w / 2 - 4, -2);
        ctx.lineTo(-w / 2 - flameLen * 0.6, 0);
        ctx.lineTo(-w / 2 - 4, 2);
        ctx.fill();
    }

    // Car body
    ctx.fillStyle = car.team.color;
    ctx.shadowColor = car.team.color;
    ctx.shadowBlur = car.isPlayer ? 14 : 6;
    ctx.beginPath();
    ctx.moveTo(w / 2, 0);
    ctx.lineTo(w / 3, -h / 2);
    ctx.lineTo(w / 8, -h / 2);
    ctx.lineTo(-w / 6, -h / 2 + 1);
    ctx.lineTo(-w / 2 + 2, -h / 3);
    ctx.lineTo(-w / 2, -h / 5);
    ctx.lineTo(-w / 2, h / 5);
    ctx.lineTo(-w / 2 + 2, h / 3);
    ctx.lineTo(-w / 6, h / 2 - 1);
    ctx.lineTo(w / 8, h / 2);
    ctx.lineTo(w / 3, h / 2);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // Body highlight
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.moveTo(w / 2 - 2, 0);
    ctx.lineTo(w / 4, -h / 3);
    ctx.lineTo(-w / 6, -h / 3);
    ctx.lineTo(-w / 4, -h / 6);
    ctx.lineTo(w / 2 - 2, -h / 6);
    ctx.closePath();
    ctx.fill();

    // Cockpit
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath();
    ctx.ellipse(w / 8, 0, w / 7, h / 3, 0, 0, TWO_PI);
    ctx.fill();
    // Helmet
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(w / 6, 0, 2.5, 0, TWO_PI);
    ctx.fill();

    // Front wing
    ctx.fillStyle = car.team.color;
    ctx.fillRect(w / 2 - 1, -h / 2 - 2, 3, h + 4);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(w / 2, -h / 2 - 1, 1, h + 2);

    // Rear wing
    ctx.fillStyle = car.team.color;
    ctx.fillRect(-w / 2, -h / 2 - 1, 3, h + 2);
    // Wing endplates
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(-w / 2, -h / 2 - 2, 3, 2);
    ctx.fillRect(-w / 2, h / 2, 3, 2);

    // Side pods
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(-w / 8, -h / 2, w / 4, 2);
    ctx.fillRect(-w / 8, h / 2 - 2, w / 4, 2);

    // Number
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 5px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(car.teamIdx + 1), 0, 0);

    // Drift sparks
    if (car.drifting) {
        for (let i = 0; i < 4; i++) {
            const sx = -w / 2 + Math.random() * 6;
            const sy = (Math.random() - 0.5) * h;
            ctx.fillStyle = `hsl(${20 + Math.random() * 40}, 100%, ${50 + Math.random() * 30}%)`;
            ctx.fillRect(sx, sy, 2, 1.5);
        }
    }

    // ERS glow
    if (car.ersActive || car.ers > 80) {
        ctx.fillStyle = `rgba(255, 215, 0, ${0.15 + Math.sin(frameCount * 0.2) * 0.08})`;
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, TWO_PI);
        ctx.fill();
    }

    ctx.restore();
}

function addTireMark(car) {
    if (!car.drifting || car.tires < 10) return;
    const rearX = car.x - Math.cos(car.angle) * 10;
    const rearY = car.y - Math.sin(car.angle) * 10;

}

function drawTireMarks() {

// ============================================================
//  PARTICLE SYSTEM
// ============================================================
let particles = [];

function spawnParticles(x, y, count, color, speed, life) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * TWO_PI;
        const spd = Math.random() * speed;
        particles.push({
            x, y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            life,
            maxLife: life,
            color,
            size: 1 + Math.random() * 2
        });
    }
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    // Cap particles
    if (particles.length > 500) particles.splice(0, particles.length - 500);
}

function drawParticles() {
    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - camera.x + shake.x - p.size / 2, p.y - camera.y + shake.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
}

// ============================================================
//  TRACK COLLISION
// ============================================================
function isOnTrack(x, y, track) {
    if (!track) return true;
    const wp = track.waypoints;
    let minDist = Infinity;
    for (let i = 0; i < wp.length; i++) {
        const p1 = wp[i];
        const p2 = wp[(i + 1) % wp.length];
        const dist = pointToSegDist(x, y, p1.x, p1.y, p2.x, p2.y);
        if (dist < minDist) minDist = dist;
    }
    return minDist < track.width / 2 + 20;
}

function pointToSegDist(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    if (len2 === 0) return Math.hypot(px - x1, py - y1);
    let t = ((px - x1) * dx + (py - y1) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

// ============================================================
//  CAR-TO-CAR SEPARATION (soft — no crash)
// ============================================================
function handleCarCollisions() {
    for (let i = 0; i < allCars.length; i++) {
        for (let j = i + 1; j < allCars.length; j++) {
            const a = allCars[i], b = allCars[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.hypot(dx, dy);
            const minDist = 22;
            if (dist < minDist && dist > 0.1) {
                const overlap = minDist - dist;
                const nx = dx / dist;
                const ny = dy / dist;
                const push = overlap * 0.5 + 0.5;
                a.x -= nx * push;
                a.y -= ny * push;
                b.x += nx * push;
                b.y += ny * push;
            }
        }
    }
}

// ============================================================
//  WAYPOINT TRACKING & LAP COUNTING
// ============================================================
function updateWaypoints(car, track) {
    const wp = track.waypoints;
    const target = wp[car.waypointIdx % wp.length];
    const dist = Math.hypot(car.x - target.x, car.y - target.y);

    if (dist < track.width * 0.8) {
        car.waypointIdx++;
        if (car.waypointIdx >= wp.length) {
            car.waypointIdx = 0;
            car.lap++;
            const lapTime = raceTime - car.lapStartTime;
            if (lapTime > 2000) { // Min 2 seconds to count as a lap
                car.lapTimes.push(lapTime);
                if (lapTime < car.bestLap) car.bestLap = lapTime;
                car.lapStartTime = raceTime;
                if (car.isPlayer) playSfx('lap');
            }
        }
    }
}

// ============================================================
//  OBSTACLES
// ============================================================
let obstacles = [];

function generateObstacles(track) {
    obstacles = [];
    const wp = track.waypoints;
    const count = Math.floor(wp.length / 3);
    for (let i = 0; i < count; i++) {
        const idx = Math.floor((i / count) * wp.length) + 2;
        const p = wp[idx % wp.length];
        const next = wp[(idx + 1) % wp.length];
        const perpAngle = Math.atan2(next.y - p.y, next.x - p.x) + PI / 2;
        const side = (i % 2 === 0) ? 1 : -1;
        const offset = (Math.random() * 0.3 + 0.1) * track.width * side;
        const ox = (p.x + next.x) / 2 + Math.cos(perpAngle) * offset;
        const oy = (p.y + next.y) / 2 + Math.sin(perpAngle) * offset;
        const type = Math.random();
        let obsType, radius, color;
        if (type < 0.35) { obsType = 'cone'; radius = 6; color = '#ff6600'; }
        else if (type < 0.6) { obsType = 'tire'; radius = 8; color = '#222'; }
        else if (type < 0.8) { obsType = 'barrel'; radius = 10; color = '#cc0000'; }
        else { obsType = 'oil'; radius = 14; color = '#4a3000'; }
        obstacles.push({ x: ox, y: oy, type: obsType, radius, color, active: true });
    }
}

function drawObstacles() {
    for (const obs of obstacles) {
        if (!obs.active) continue;
        const sx = obs.x - camera.x + shake.x;
        const sy = obs.y - camera.y + shake.y;
        if (sx < -30 || sx > canvas.width + 30 || sy < -30 || sy > canvas.height + 30) continue;
        ctx.save();
        ctx.translate(sx, sy);
        switch (obs.type) {
            case 'cone':
                ctx.fillStyle = '#ff6600';
                ctx.beginPath();
                ctx.moveTo(0, -obs.radius);
                ctx.lineTo(-obs.radius * 0.6, obs.radius * 0.5);
                ctx.lineTo(obs.radius * 0.6, obs.radius * 0.5);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.fillRect(-3, -2, 6, 2);
                break;
            case 'tire':
                ctx.fillStyle = '#222';
                ctx.beginPath();
                ctx.arc(0, 0, obs.radius, 0, TWO_PI);
                ctx.fill();
                ctx.fillStyle = '#444';
                ctx.beginPath();
                ctx.arc(0, 0, obs.radius * 0.5, 0, TWO_PI);
                ctx.fill();
                break;
            case 'barrel':
                ctx.fillStyle = '#cc0000';
                ctx.beginPath();
                ctx.arc(0, 0, obs.radius, 0, TWO_PI);
                ctx.fill();
                ctx.fillStyle = '#ff3333';
                ctx.fillRect(-obs.radius + 2, -2, obs.radius * 2 - 4, 4);
                break;
            case 'oil':
                ctx.fillStyle = 'rgba(60,40,0,0.6)';
                ctx.beginPath();
                ctx.ellipse(0, 0, obs.radius, obs.radius * 0.7, 0, 0, TWO_PI);
                ctx.fill();
                ctx.fillStyle = 'rgba(80,60,10,0.4)';
                ctx.beginPath();
                ctx.ellipse(-2, -2, obs.radius * 0.5, obs.radius * 0.35, 0.3, 0, TWO_PI);
                ctx.fill();
                break;
        }
        ctx.restore();
    }
}

// ============================================================
//  POWER-UPS (Arcade)
// ============================================================
let powerups = [];
let oilSpills = [];

function spawnPowerups(track) {
    powerups = [];
    const wp = track.waypoints;
    for (let i = 0; i < 8; i++) {
        const idx = Math.floor(Math.random() * wp.length);
        const p = wp[idx];
        const next = wp[(idx + 1) % wp.length];
        const mx = (p.x + next.x) / 2 + (Math.random() - 0.5) * 30;
        const my = (p.y + next.y) / 2 + (Math.random() - 0.5) * 30;
        powerups.push({
            x: mx, y: my,
            type: POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)],
            active: true,
            respawnTimer: 0
        });
    }
}

function updatePowerups() {
    for (const pu of powerups) {
        if (!pu.active) {
            pu.respawnTimer--;
            if (pu.respawnTimer <= 0) pu.active = true;
            continue;
        }
        for (const car of allCars) {
            if (car.powerup) continue;
            const dist = Math.hypot(car.x - pu.x, car.y - pu.y);
            if (dist < 20) {
                car.powerup = pu.type;
                pu.active = false;
                pu.respawnTimer = 600; // 10 seconds
                if (car.isPlayer) showCenterMessage(POWERUP_LABELS[pu.type] + '!');
                break;
            }
        }
    }

    // Oil spills
    for (let i = oilSpills.length - 1; i >= 0; i--) {
        oilSpills[i].life--;
        if (oilSpills[i].life <= 0) oilSpills.splice(i, 1);
    }
}

function usePowerup(car) {
    if (!car.powerup) return;
    const type = car.powerup;
    car.powerup = null;

    switch (type) {
        case 'turbo':
            car.turboActive = true;
            car.turboTimer = 90;
            break;
        case 'shield':
            car.shieldActive = true;
            car.turboTimer = 180;
            break;
        case 'missile': {
            // Hit nearest car ahead
            let nearest = null, nearDist = Infinity;
            for (const other of allCars) {
                if (other === car) continue;
                const angleTo = Math.atan2(other.y - car.y, other.x - car.x);
                let aDiff = angleTo - car.angle;
                while (aDiff > PI) aDiff -= TWO_PI;
                while (aDiff < -PI) aDiff += TWO_PI;
                if (Math.abs(aDiff) < PI / 3) {
                    const d = Math.hypot(other.x - car.x, other.y - car.y);
                    if (d < nearDist && d < 400) { nearest = other; nearDist = d; }
                }
            }
            if (nearest && !nearest.shieldActive) {
                nearest.speed *= 0.2;
                spawnParticles(nearest.x, nearest.y, 20, '#ff0000', 5, 30);
                shake.intensity = 8;
                if (car.isPlayer) showCenterMessage('IMPACTO!');
            } else {
                if (car.isPlayer) showCenterMessage('SIN OBJETIVO');
            }
            break;
        }
        case 'oil':
            oilSpills.push({ x: car.x, y: car.y, life: 300, radius: 25 });
            break;
        case 'chaos':
            for (const other of allCars) {
                if (other !== car) other.angle += PI; // Reverse controls effectively
            }
            if (car.isPlayer) showCenterMessage('¡CAOS!');
            break;
    }
}

function drawPowerups() {
    for (const pu of powerups) {
        if (!pu.active) continue;
        const sx = pu.x - camera.x + shake.x;
        const sy = pu.y - camera.y + shake.y;
        ctx.fillStyle = POWERUP_COLORS[pu.type];
        ctx.shadowColor = POWERUP_COLORS[pu.type];
        ctx.shadowBlur = 10 + Math.sin(frameCount * 0.1) * 5;
        ctx.beginPath();
        ctx.arc(sx, sy, 8 + Math.sin(frameCount * 0.08) * 2, 0, TWO_PI);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 8px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const labels = { missile: 'M', shield: 'S', oil: 'O', turbo: 'T', chaos: 'C' };
        ctx.fillText(labels[pu.type], sx, sy);
    }

    // Oil spills
    for (const oil of oilSpills) {
        const sx = oil.x - camera.x + shake.x;
        const sy = oil.y - camera.y + shake.y;
        const alpha = oil.life / 300;
        ctx.fillStyle = `rgba(60, 40, 20, ${alpha * 0.6})`;
        ctx.beginPath();
        ctx.ellipse(sx, sy, oil.radius, oil.radius * 0.6, 0, 0, TWO_PI);
        ctx.fill();
    }
}

// ============================================================
//  RACE MANAGEMENT
// ============================================================
let allCars = [];
let playerCar = null;
let totalLaps = 12;
let raceFinished = false;
let podiumData = [];

function setupRace() {
    const track = CIRCUITS[selectedCircuit];
    currentTrack = track;
    totalLaps = track.laps;
    buildTrackPath(track);
    generateDecorations(track);

    allCars = [];
    const wp = track.waypoints;
    const startAngle = Math.atan2(wp[1].y - wp[0].y, wp[1].x - wp[0].x);

    // Player
    const pc = new Car(selectedTeam, wp[0].x, wp[0].y, startAngle, true);
    pc.lapStartTime = 0;
    allCars.push(pc);
    playerCar = pc;

    // AI rivals (9 cars) — staggered grid with good spacing
    for (let i = 0; i < 9; i++) {
        const teamIdx = i === selectedTeam ? (i + 1) % 10 : i;
        const row = Math.floor(i / 2);
        const col = (i % 2) - 0.5;
        const offset = (row + 1) * 45;
        const perpAngle = startAngle + PI / 2;
        const ax = wp[0].x - Math.cos(startAngle) * offset + Math.cos(perpAngle) * col * 30;
        const ay = wp[0].y - Math.sin(startAngle) * offset + Math.sin(perpAngle) * col * 30;
        const car = new Car(teamIdx, ax, ay, startAngle, false);
        car.waypointIdx = 0;
        car.lapStartTime = 0;
        allCars.push(car);
    }

    raceTime = 0;
    raceFinished = false;
    particles = [];
    powerups = [];
    oilSpills = [];
    clearTireMarks();
    generateObstacles(track);

    if (gameMode === 'arcade') spawnPowerups(track);
}

// ============================================================
//  RANKING
// ============================================================
function getRanking() {
    return allCars.slice().sort((a, b) => {
        if (a.lap !== b.lap) return b.lap - a.lap;
        return b.waypointIdx - a.waypointIdx;
    });
}

function getPlayerPosition() {
    const rank = getRanking();
    for (let i = 0; i < rank.length; i++) {
        if (rank[i].isPlayer) return i + 1;
    }
    return 10;
}

// ============================================================
//  HUD
// ============================================================
function updateHUD() {
    if (!playerCar) return;
    const pos = getPlayerPosition();
    document.getElementById('hudPos').textContent = pos;
    document.getElementById('hudPosSuffix').textContent = pos === 1 ? 'er' : '°';
    document.getElementById('hudLap').textContent = `Vuelta ${Math.min(playerCar.lap + 1, totalLaps)}/${totalLaps}`;
    document.getElementById('hudTime').textContent = formatTime(raceTime);
    document.getElementById('hudSpeed').textContent = Math.round(Math.abs(playerCar.speed) / playerCar.maxSpeed * 320);
    document.getElementById('hudErsFill').style.width = `${playerCar.ers}%`;
    document.getElementById('hudTireFill').style.width = `${playerCar.tires}%`;

    // Tire color
    const tireFill = document.getElementById('hudTireFill');
    if (playerCar.tires > 60) tireFill.style.background = '#00ff88';
    else if (playerCar.tires > 30) tireFill.style.background = '#ffd700';
    else tireFill.style.background = '#ff0044';

    // Tire type indicator
    const tireTypeEl = document.getElementById('hudTireType');
    const tireNames = { soft: 'BLANDOS', medium: 'MEDIOS', wet: 'LLUVIA' };
    const tireColors = { soft: '#ff0044', medium: '#ffd700', wet: '#3b82f6' };
    tireTypeEl.textContent = tireNames[playerCar.tireType] || 'BLANDOS';
    tireTypeEl.style.background = tireColors[playerCar.tireType] || '#ff0044';
    tireTypeEl.style.color = '#fff';

    // Lap times
    if (playerCar.lapTimes.length > 0) {
        const last = playerCar.lapTimes[playerCar.lapTimes.length - 1];
        document.getElementById('hudLastLap').textContent = formatTime(last);
    }
    if (playerCar.bestLap < Infinity) {
        document.getElementById('hudBestLap').textContent = formatTime(playerCar.bestLap);
    }
    const currentLapTime = raceTime - playerCar.lapStartTime;
    document.getElementById('hudCurrentLap').textContent = formatTime(currentLapTime);

    // Drift indicator
    const driftEl = document.getElementById('hudDrift');
    driftEl.classList.toggle('visible', playerCar.drifting);

    // ERS ready
    const ersReadyEl = document.getElementById('hudErsReady');
    ersReadyEl.classList.toggle('visible', playerCar.ers >= ERS_COST);

    // Slipstream
    const slipEl = document.getElementById('hudSlip');
    slipEl.classList.toggle('visible', playerCar.slipstreamActive);

    // Leaderboard
    const rank = getRanking();
    const lbEl = document.getElementById('hudLeaderboard');
    lbEl.innerHTML = rank.slice(0, 6).map((car, i) => {
        const posClass = i < 3 ? ` p${i + 1}` : '';
        const name = car.isPlayer ? '★ TÚ' : car.team.name.split(' ')[0];
        const lapTxt = `V${Math.min(car.lap + 1, totalLaps)}`;
        return `<div class="lb-row" style="${car.isPlayer ? 'color:#00d4ff;' : ''}"><span class="lb-pos${posClass}">${i + 1}°</span><span class="lb-dot" style="background:${car.team.color};"></span><span class="lb-name">${name}</span><span class="lb-lap">${lapTxt}</span></div>`;
    }).join('');
}

function formatTime(ms) {
    const totalSec = ms / 1000;
    const min = Math.floor(totalSec / 60);
    const sec = Math.floor(totalSec % 60);
    const mil = Math.floor(ms % 1000);
    return `${min}:${sec.toString().padStart(2, '0')}.${mil.toString().padStart(3, '0')}`;
}

let centerMsgTimer = 0;
function showCenterMessage(msg) {
    const el = document.getElementById('hudCenterMsg');
    el.textContent = msg;
    el.classList.add('visible');
    centerMsgTimer = 90;
}

// ============================================================
//  WEATHER
// ============================================================
let weather = { state: 'dry', intensity: 0, targetIntensity: 0, timer: 0 };

function updateWeather(track) {
    weather.timer++;
    if (weather.timer > 1800) { // Every 30 seconds
        weather.timer = 0;
        if (Math.random() < (track.weatherProb || 0)) {
            weather.targetIntensity = 0.5 + Math.random() * 0.5;
            weather.state = 'rain';
        } else {
            weather.targetIntensity = 0;
            weather.state = 'dry';
        }
    }
    weather.intensity += (weather.targetIntensity - weather.intensity) * 0.01;
}

function drawWeather() {
    if (weather.intensity < 0.01) return;
    ctx.fillStyle = `rgba(100, 150, 255, ${weather.intensity * 0.08})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < weather.intensity * 30; i++) {
        const rx = Math.random() * canvas.width;
        const ry = Math.random() * canvas.height;
        ctx.strokeStyle = `rgba(150, 200, 255, ${weather.intensity * 0.4})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(rx, ry);
        ctx.lineTo(rx - 2, ry + 8);
        ctx.stroke();
    }
}

function drawSpeedLines() {
    if (!playerCar) return;
    const speedRatio = Math.abs(playerCar.speed) / playerCar.maxSpeed;
    if (speedRatio < 0.6) return;
    const intensity = (speedRatio - 0.6) * 2.5;
    const count = Math.floor(intensity * 8);
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(playerCar.angle + PI);
    for (let i = 0; i < count; i++) {
        const x = (Math.random() - 0.5) * canvas.width * 0.8;
        const y = (Math.random() - 0.5) * canvas.height * 0.6;
        const len = 20 + Math.random() * 40 * intensity;
        ctx.strokeStyle = `rgba(255,255,255,${0.05 + Math.random() * 0.08 * intensity})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y + len);
        ctx.stroke();
    }
    ctx.restore();
}

// ============================================================
//  MAIN GAME LOOP
// ============================================================
function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    dt = (timestamp - lastTime) / 16.67; // Normalize to ~60fps
    lastTime = timestamp;
    frameCount++;

    if (gameState === 'racing') {
        readGamepad();
        updateRace(dt);
    }

    requestAnimationFrame(gameLoop);
}

function updateRace(dt) {
    raceTime += 16.67 * dt;

    // Player input
    if (playerCar && !playerCar.finished) {
        if (isAccel()) playerCar.speed += playerCar.accel * dt;
        else if (isBrake()) playerCar.speed -= playerCar.brakeForce * dt;
        else playerCar.speed -= FRICTION * playerCar.speed * dt;

        if (isDrift()) {
            playerCar.drifting = true;
            playerCar.angle += (isLeft() ? -1 : isRight() ? 1 : 0) * playerCar.turnRate * DRIFT_TURN_MULT * dt;
            playerCar.speed -= DRIFT_FRICTION * playerCar.speed * dt;
            if (frameCount % 3 === 0) spawnParticles(
                playerCar.x - Math.cos(playerCar.angle) * 12,
                playerCar.y - Math.sin(playerCar.angle) * 12,
                2, '#ff4500', 2, 15
            );
            if (frameCount % 10 === 0) playSfx('drift');
        } else {
            playerCar.drifting = false;
            if (isLeft()) playerCar.angle -= playerCar.turnRate * dt;
            if (isRight()) playerCar.angle += playerCar.turnRate * dt;
        }

        playerCar.speed = Math.max(-playerCar.maxSpeed * 0.3, Math.min(playerCar.speed, playerCar.maxSpeed));

        // ERS
        if (isErs() && playerCar.ers >= ERS_COST && !playerCar.ersActive) {
            playerCar.ersActive = true;
            playSfx('ers');
        }

        // Powerup
        if (keys['e'] || keys['enter']) {
            usePowerup(playerCar);
            keys['e'] = false;
        }

        // Slipstream detection vs AI
        for (const other of allCars) {
            if (other === playerCar || !other) continue;
            const dist = Math.hypot(other.x - playerCar.x, other.y - playerCar.y);
            const angleToOther = Math.atan2(other.y - playerCar.y, other.x - playerCar.x);
            let aDiff = angleToOther - playerCar.angle;
            while (aDiff > PI) aDiff -= TWO_PI;
            while (aDiff < -PI) aDiff += TWO_PI;
            if (dist < SLIPSTREAM_DIST && Math.abs(aDiff) < 0.3) {
                playerCar.slipstreamTimer++;
                if (playerCar.slipstreamTimer > SLIPSTREAM_TIME) {
                    playerCar.slipstreamActive = true;
                    playerCar.speed = Math.min(playerCar.speed * 1.002, playerCar.maxSpeed * SLIPSTREAM_MULT);
                }
            }
        }
        if (playerCar.slipstreamTimer > 0) playerCar.slipstreamTimer--;
        if (playerCar.slipstreamActive && playerCar.slipstreamTimer < -60) playerCar.slipstreamActive = false;

        // Tire change on pit (press T near start)
        if (keys['t']) {
            const startDist = Math.hypot(playerCar.x - currentTrack.waypoints[0].x, playerCar.y - currentTrack.waypoints[0].y);
            if (startDist < currentTrack.width) {
                playerCar.tires = 100;
                playerCar.tireType = weather.state === 'rain' ? 'wet' : 'soft';
                showCenterMessage('NEUMÁTICOS CAMBIADOS');
            }
            keys['t'] = false;
        }
    }

    // Physics for all cars
    for (const car of allCars) {
        if (!car.isPlayer) aiUpdate(car, currentTrack, allCars);
        carPhysics(car);
        updateWaypoints(car, currentTrack);
        addTireMark(car);

        // Drift particles for AI
        if (car.drifting && !car.isPlayer && frameCount % 5 === 0) {
            spawnParticles(
                car.x - Math.cos(car.angle) * 12,
                car.y - Math.sin(car.angle) * 12,
                1, car.team.color, 2, 10
            );
        }
    }

    handleCarCollisions();
    updateParticles();
    if (gameMode === 'arcade') updatePowerups();
    updateWeather(currentTrack);

    // Camera follow player
    if (playerCar) {
        const tx = playerCar.x - canvas.width / 2;
        const ty = playerCar.y - canvas.height / 2;
        camera.x += (tx - camera.x) * 0.08;
        camera.y += (ty - camera.y) * 0.08;
    }

    // Screen shake
    if (shake.intensity > 0) {
        shake.x = (Math.random() - 0.5) * shake.intensity * (settings.shakeAmount / 100);
        shake.y = (Math.random() - 0.5) * shake.intensity * (settings.shakeAmount / 100);
        shake.intensity *= 0.9;
        if (shake.intensity < 0.1) { shake.intensity = 0; shake.x = 0; shake.y = 0; }
    }

    // Center message timer
    if (centerMsgTimer > 0) {
        centerMsgTimer--;
        if (centerMsgTimer <= 0) document.getElementById('hudCenterMsg').classList.remove('visible');
    }

    // Check race finish
    if (playerCar && playerCar.lap >= totalLaps && !raceFinished) {
        raceFinished = true;
        playerCar.finished = true;
        playerCar.finishTime = raceTime;
        setTimeout(showPodium, 2000);
    }

    // Engine sound
    if (playerCar) updateEngineSound(playerCar.speed, playerCar.maxSpeed);

    // RENDER
    drawTrack(currentTrack);
    drawTireMarks();
    drawObstacles();
    if (gameMode === 'arcade') drawPowerups();

    // Sort cars by Y for pseudo-depth
    const sorted = allCars.slice().sort((a, b) => a.y - b.y);
    for (const car of sorted) drawCar(car);

    drawParticles();
    drawWeather();
    drawSpeedLines();
    drawMinimap(currentTrack);
    updateHUD();

    // Night mode overlay
    if (currentTrack && currentTrack.night) {
        // Vignette
        const grd = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, canvas.width * 0.2, canvas.width / 2, canvas.height / 2, canvas.width * 0.7);
        grd.addColorStop(0, 'rgba(0,0,0,0)');
        grd.addColorStop(1, 'rgba(0,0,20,0.6)');
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Headlight cone from player
        if (playerCar) {
            ctx.save();
            ctx.translate(playerCar.x - camera.x + shake.x, playerCar.y - camera.y + shake.y);
            ctx.rotate(playerCar.angle);
            const hGrd = ctx.createRadialGradient(0, 0, 5, 0, 0, 150);
            hGrd.addColorStop(0, 'rgba(255,255,200,0.15)');
            hGrd.addColorStop(1, 'rgba(255,255,200,0)');
            ctx.fillStyle = hGrd;
            ctx.beginPath();
            ctx.moveTo(0, -30);
            ctx.lineTo(150, 0);
            ctx.lineTo(0, 30);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
    }
}

// ============================================================
//  UI FUNCTIONS
// ============================================================
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.getElementById('raceHud').style.display = 'none';
    document.getElementById('pauseOverlay').classList.remove('active');

    if (id === 'garageScreen') buildGarage();
    if (id === 'circuitScreen') buildCircuitGrid();
}

function buildGarage() {
    const grid = document.getElementById('teamGrid');
    grid.innerHTML = '';
    TEAMS.forEach((team, i) => {
        const card = document.createElement('div');
        card.className = 'team-card' + (i === selectedTeam ? ' selected' : '');
        card.innerHTML = `
            <div class="car-preview" style="background:${team.color};"></div>
            <div class="team-name">${team.name}</div>
        `;
        card.onclick = () => { selectedTeam = i; buildGarage(); };
        grid.appendChild(card);
    });

    const stats = document.getElementById('statsPanel');
    const t = TEAMS[selectedTeam];
    const statsData = [
        { label: 'Motor', value: t.motor, color: '#ff4444' },
        { label: 'Aero', value: t.aero, color: '#3b82f6' },
        { label: 'Agarre', value: t.grip, color: '#22c55e' },
        { label: 'Frenada', value: t.brake, color: '#ffd700' }
    ];
    stats.innerHTML = statsData.map(s => `
        <div class="stat-bar">
            <label>${s.label}</label>
            <div class="bar-bg"><div class="bar-fill" style="width:${s.value * 10}%;background:${s.color};"></div></div>
        </div>
    `).join('');

    // Difficulty buttons
    document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.diff === difficulty);
        btn.onclick = () => { difficulty = btn.dataset.diff; buildGarage(); };
    });
}

function buildCircuitGrid() {
    const grid = document.getElementById('circuitGrid');
    grid.innerHTML = '';
    CIRCUITS.forEach((c, i) => {
        const locked = i > 0 && gameMode === 'championship' && !isCircuitUnlocked(i);
        const card = document.createElement('div');
        card.className = 'circuit-card' + (i === selectedCircuit ? ' selected' : '') + (locked ? ' locked' : '');
        card.innerHTML = `
            <div class="circuit-icon">${c.country}</div>
            <div class="circuit-name">${c.name}</div>
            <div class="circuit-diff">${'★'.repeat(c.difficulty)}${'☆'.repeat(5 - c.difficulty)}</div>
            ${locked ? '<div style="color:#ff4444;font-size:0.65rem;margin-top:4px;">🔒 Bloqueado</div>' : ''}
        `;
        if (!locked) card.onclick = () => { selectedCircuit = i; buildCircuitGrid(); };
        grid.appendChild(card);
    });
}

function isCircuitUnlocked(idx) {
    if (idx === 0) return true;
    const progress = parseInt(localStorage.getItem('apexgp_progress') || '0');
    if (idx <= 2) return progress >= 1;
    if (idx <= 4) return progress >= 2;
    if (idx <= 6) return progress >= 4;
    return progress >= 6;
}

function startRace() {
    initAudio();
    setupRace();
    showScreen('startScreen');
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('raceHud').style.display = 'block';
    gameState = 'countdown';
    startCountdown();
}

function startTimeTrial() {
    gameMode = 'timeTrial';
    initAudio();
    setupRace();
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('raceHud').style.display = 'block';
    gameState = 'countdown';
    startCountdown();
}

function startArcade() {
    gameMode = 'arcade';
    initAudio();
    setupRace();
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('raceHud').style.display = 'block';
    gameState = 'countdown';
    startCountdown();
}

function startCountdown() {
    countdownNum = 3;
    countdownTimer = 0;
    const cdEl = document.getElementById('countdown');
    cdEl.classList.add('visible');

    function tick() {
        if (countdownNum > 0) {
            cdEl.textContent = countdownNum;
            cdEl.style.color = '#fff';
            playSfx('countdown');
            countdownNum--;
            setTimeout(tick, 1000);
        } else {
            cdEl.textContent = '¡GO!';
            cdEl.style.color = '#00ff88';
            playSfx('go');
            gameState = 'racing';
            setTimeout(() => { cdEl.classList.remove('visible'); }, 800);
        }
    }
    tick();
}

function togglePause() {
    if (gameState === 'racing') {
        gameState = 'paused';
        document.getElementById('pauseOverlay').classList.add('active');
    } else if (gameState === 'paused') {
        resumeRace();
    }
}

function resumeRace() {
    gameState = 'racing';
    document.getElementById('pauseOverlay').classList.remove('active');
}

function quitRace() {
    gameState = 'menu';
    document.getElementById('pauseOverlay').classList.remove('active');
    document.getElementById('raceHud').style.display = 'none';
    showScreen('startScreen');
    if (engineGain) engineGain.gain.value = 0;
}

function showPodium() {
    gameState = 'podium';
    document.getElementById('raceHud').style.display = 'none';
    const rank = getRanking();
    const pos = getPlayerPosition();

    // Save progress & award money
    if (pos <= 3) {
        const progress = parseInt(localStorage.getItem('apexgp_progress') || '0');
        if (progress < selectedCircuit + 1) {
            localStorage.setItem('apexgp_progress', String(selectedCircuit + 1));
        }
    }

    let prize = PRIZE_MONEY[pos] || 0;
    let bonusMsg = '';
    if (isBossRace()) {
        prize = pos === 1 ? BOSS_PRIZE : 0;
        if (pos === 1) bonusMsg = '¡BOSS DERROTADO! +$300';
    }
    if (pos === 1) addWin();
    if (prize > 0) addMoney(prize);

    const podiumEl = document.getElementById('podiumCars');
    const podiumOrder = [rank[1], rank[0], rank[2]];
    const classes = ['second', 'first', 'third'];

    podiumEl.innerHTML = podiumOrder.map((car, i) => `
        <div class="podium-car ${classes[i]}" style="order:${i}">
            <div class="pos">${i === 1 ? '1°' : i === 0 ? '2°' : '3°'}</div>
            <div class="car-shape" style="width:50px;height:20px;background:${car.team.color};box-shadow:0 0 15px ${car.team.color}55;"></div>
            <div class="name">${car.team.name}</div>
        </div>
    `).join('');

    const statsEl = document.getElementById('podiumStats');
    const pt = playerCar;
    const moneyEl = prize > 0 ? `<br><span style="color:#ffd700;font-size:1.3rem;font-weight:900;">+$${prize}</span>` : '';
    const bossEl = bonusMsg ? `<br><span style="color:#ff0044;font-size:1.1rem;font-weight:900;">${bonusMsg}</span>` : '';
    statsEl.innerHTML = `
        Posición: <span>${pos}°</span> | Vueltas: <span>${pt.lap}</span><br>
        Mejor vuelta: <span>${pt.bestLap < Infinity ? formatTime(pt.bestLap) : '--:--'}</span><br>
        Tiempo total: <span>${formatTime(raceTime)}</span><br>
        Penalizaciones: <span>${pt.penalty}s</span>${moneyEl}${bossEl}<br>
        <span style="color:#888;font-size:0.8rem;">Balance: $${getMoney()}</span>
    `;

    showScreen('podiumScreen');
    if (engineGain) engineGain.gain.value = 0;
}

// ============================================================
//  SETTINGS HANDLERS
// ============================================================
document.getElementById('volEngine').oninput = e => { settings.volEngine = +e.target.value; document.getElementById('volEngineVal').textContent = e.target.value; };
document.getElementById('volMusic').oninput = e => { settings.volMusic = +e.target.value; document.getElementById('volMusicVal').textContent = e.target.value; };
document.getElementById('volSfx').oninput = e => { settings.volSfx = +e.target.value; document.getElementById('volSfxVal').textContent = e.target.value; };
document.getElementById('shakeAmount').oninput = e => { settings.shakeAmount = +e.target.value; document.getElementById('shakeAmountVal').textContent = e.target.value; };

// ============================================================
//  RESIZE
// ============================================================
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ============================================================
//  INIT
// ============================================================
requestAnimationFrame(gameLoop);
</script>
