apply plugin: 'com.android.application'

android {
    namespace = "click.yapido.lavadoras"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "click.yapido.lavadoras"
        minSdkVersion 24
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.0.0"
        resourceConfigurations += ['es', 'en']
        manifestPlaceholders = [
            'appName': 'Lavadoras',
            'appUrl': 'https://lavadoras.yapido.click'
        ]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        // Lee credenciales de variables de entorno (.env.local NO; gradle.properties local SÍ).
        // Si faltan LAV_KEYSTORE_PATH/LAV_KEYSTORE_PASS/LAV_KEY_ALIAS/LAV_KEY_PASS,
        // este bloque firma con el debug keystore (útil solo para local). Ver DEPLOY_GUIDE.md.
        release {
            def ksPath = System.getenv('LAV_KEYSTORE_PATH') ?: ''
            def ksPass = System.getenv('LAV_KEYSTORE_PASS') ?: ''
            def keyAlias = System.getenv('LAV_KEY_ALIAS') ?: ''
            def keyPass = System.getenv('LAV_KEY_PASS') ?: ''
            if (ksPath && ksPass && keyAlias && keyPass) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias keyAlias
                keyPassword keyPass
            } else {
                // Fallback: firma debug para no romper local builds.
                storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            // Para testing local: minify off para stack traces legibles
            minifyEnabled false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
