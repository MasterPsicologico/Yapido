apply plugin: 'com.android.application'

android {
    namespace = "lava.yapido.click"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "lava.yapido.click"
        minSdkVersion 24
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 55
        versionName "1.4.14"
        resourceConfigurations += ['es', 'en']
        manifestPlaceholders = [
            'appName': 'Lavadoras',
            'appUrl': 'https://lavadoras.yapido.click'
        ]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        buildConfigField "String", "GOOGLE_CLIENT_SECRET", System.getenv('GOOGLE_CLIENT_SECRET') ?: '"REPLACE_WITH_YOUR_CLIENT_SECRET"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            String ksPath = rootProject.file('../secrets/lav-release.jks').absolutePath
            String ksPass = System.getenv('LAV_KEYSTORE_PASS') ?: ''
            String aliasName = System.getenv('LAV_KEY_ALIAS') ?: 'lavadoras-upload'
            String keyPass = System.getenv('LAV_KEY_PASS') ?: ksPass
            String ksEnvPath = System.getenv('LAV_KEYSTORE_PATH')
            if (ksEnvPath != null && !ksEnvPath.isEmpty()) {
                ksPath = ksEnvPath
            }
            String lavaJksPath = 'C:\\Users\\dcard\\OneDrive\\Escritorio\\lava.jks'
            if (new File(lavaJksPath).exists()) {
                ksPath = lavaJksPath
                ksPass = 'Oscar161991'
                aliasName = 'key0'
                keyPass = 'Oscar161991'
            }
            storeFile file(ksPath)
            storePassword ksPass
            keyAlias aliasName
            keyPassword keyPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.browser:browser:1.8.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

    try {
        def servicesJSON = file('google-services.json')
        def servicesText = servicesJSON.exists() ? servicesJSON.text : ''
        if (servicesText && servicesText.contains('lava.yapido.click')) {
            apply plugin: 'com.google.gms.google-services'
            logger.lifecycle("google-services plugin applied for lava.yapido.click")
        } else if (servicesText) {
            logger.warn("google-services.json exists but package_name does not match 'lava.yapido.click'. Reemplaza el archivo descargandolo de Firebase Console (proyecto studio-4796645076-6f375).")
        } else {
            logger.warn("google-services.json not found, google-services plugin not applied.")
        }
    } catch(Exception e) {
        logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
    }
