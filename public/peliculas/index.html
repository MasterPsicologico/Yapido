<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStream</title>
    <link rel="stylesheet" href="styles.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase (Compatible with v8 as used in the code) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
    <header>
        <div class="logo">CineStream</div>
        <nav>
            <button class="nav-btn active" data-filter="all">Todo</button>
            <button class="nav-btn" data-filter="accion">Acción</button>
            <button class="nav-btn" data-filter="comedia">Comedia</button>
            <button class="nav-btn" data-filter="drama">Drama</button>
            <button class="nav-btn" data-filter="terror">Terror</button>
            <button class="nav-btn" data-filter="anime">Anime</button>
        </nav>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Buscar película...">
        </div>
    </header>

    <main>
        <section id="heroSection" class="hero-section"></section>
        
        <div class="filters">
            <select id="sortSelect">
                <option value="rating">Mejor Valoradas</option>
                <option value="year">Más Recientes</option>
                <option value="title">Título A-Z</option>
            </select>
            <select id="yearFilter">
                <option value="all">Cualquier año</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
            </select>
            <select id="typeFilter">
                <option value="all">Todos los tipos</option>
                <option value="pelicula">Películas</option>
                <option value="documental">Documentales</option>
            </select>
            <select id="languageFilter">
                <option value="both">Cualquier idioma</option>
                <option value="es">Español</option>
                <option value="en">Inglés</option>
            </select>
        </div>

        <section id="movieRows"></section>
        
        <section id="moviesGrid" class="movies-grid"></section>
        
        <div id="pagination" class="pagination"></div>
    </main>

    <!-- Player Modal -->
    <div id="playerModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span id="closePlayer" class="close">&times;</span>
            <div id="videoPlaceholder" class="video-placeholder">Cargando...</div>
            <div id="youtubeEmbed" class="youtube-embed"></div>
            <div class="player-info">
                <h2 id="playerTitle"></h2>
                <div class="player-meta">
                    <span id="playerYear"></span>
                    <span id="playerGenre"></span>
                    <span id="playerRating"></span>
                </div>
                <p id="playerDescription"></p>
            </div>
        </div>
    </div>

    <!-- App Scripts -->
    <script src="firestore-service.js"></script>
    <script src="app.js"></script>
    <script>
        // Init the app when loaded
        window.addEventListener('DOMContentLoaded', () => {
            if(typeof init === 'function') init();
        });
    </script>
</body>
</html>
